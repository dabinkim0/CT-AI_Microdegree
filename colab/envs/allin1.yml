# 03 Allin1. madmom과 allin1은 setup.sh가 이어서 설치한다.
# NATTEN은 넣지 않는다. 노트북이 colab/natten_torch.py(순수 PyTorch)를 natten 대신 쓴다.
name: ctai-allin1
channels: [conda-forge, nodefaults]
dependencies:
  - python=3.12
  - pip
  - git          # madmom을 GitHub에서 받기 (빌드에는 C 컴파일러도 필요: macOS는 xcode-select --install)
  - ffmpeg       # YouTube 입력 (yt-dlp가 wav로 바꿀 때)
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - torch==2.6.0
    - torchaudio==2.6.0
    - numpy
    - -r ../requirements/03_allin1_base.txt
    - librosa>=0.10
    - matplotlib
    - jupyter
